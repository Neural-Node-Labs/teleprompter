<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Teleprompter Remote</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    input {
      width: 80%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      text-align: center;
    }
    button {
      width: 80%;
      padding: 18px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      background: #4f8ef7;
      color: white;
      font-weight: 600;
    }
    button.secondary {
      background: #333;
    }
    #status {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h2>Teleprompter Remote</h2>
  <input id="host" placeholder="PC IP address, e.g. 192.168.1.20" />
  <button id="connectBtn">Connect</button>
  <div id="status">Not connected</div>

  <button id="playPauseBtn" disabled>Play / Pause</button>
  <button id="restartBtn" class="secondary" disabled>Restart</button>
  <div style="display:flex; gap:10px; width:80%;">
    <button id="slowerBtn" class="secondary" disabled style="flex:1;">Slower</button>
    <button id="fasterBtn" class="secondary" disabled style="flex:1;">Faster</button>
  </div>

  <script>
    let ws = null;

    function send(command) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ command }));
      }
    }

    document.getElementById('connectBtn').addEventListener('click', () => {
      const host = document.getElementById('host').value.trim();
      if (!host) return;

      ws = new WebSocket(`ws://${host}:8787`);
      const statusEl = document.getElementById('status');

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        document.querySelectorAll('button:not(#connectBtn)').forEach((b) => (b.disabled = false));
      };
      ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
        document.querySelectorAll('button:not(#connectBtn)').forEach((b) => (b.disabled = true));
      };
      ws.onerror = () => {
        statusEl.textContent = 'Connection error';
      };
    });

    document.getElementById('playPauseBtn').addEventListener('click', () => send('toggle'));
    document.getElementById('restartBtn').addEventListener('click', () => send('restart'));
    document.getElementById('slowerBtn').addEventListener('click', () => send('speed-down'));
    document.getElementById('fasterBtn').addEventListener('click', () => send('speed-up'));
  </script>
</body>
</html>
